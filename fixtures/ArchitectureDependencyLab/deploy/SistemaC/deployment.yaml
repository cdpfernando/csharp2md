# SCENARIO:HOST-001
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sistema-c-api
  labels:
    app: sistema-c
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sistema-c
  template:
    metadata:
      labels:
        app: sistema-c
    spec:
      containers:
      - name: api
        image: synthetic-registry.local/sistema-c:1.0.0
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ConnectionStrings__Primary
          value: "Data Source=synthetic_data.db"
        - name: Cache__Credential
          value: "NOT_A_REAL_SECRET_ROTATE_ME"
