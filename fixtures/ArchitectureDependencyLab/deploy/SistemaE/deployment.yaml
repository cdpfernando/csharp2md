# SCENARIO:HOST-001
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sistema-e-api
  labels:
    app: sistema-e
spec:
  replicas: 4
  selector:
    matchLabels:
      app: sistema-e
  template:
    metadata:
      labels:
        app: sistema-e
    spec:
      containers:
      - name: api
        image: synthetic-registry.local/sistema-e:1.0.0
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ConnectionStrings__Primary
          value: "Data Source=synthetic_data.db"
        - name: Messaging__ClientPassword
          value: "NOT_A_REAL_SECRET_ROTATE_ME"
